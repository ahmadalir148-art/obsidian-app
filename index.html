<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Obsidian</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#c9a96e;--g2:#e8c98a;--b:#08080B;--w:#f0efe9;--gr:#666;--card:#111114;--br:rgba(201,169,110,0.12)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--b);color:var(--w);font-family:'Inter',sans-serif;overflow-x:hidden;padding-bottom:80px}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;
  background:linear-gradient(180deg,rgba(8,8,11,1) 70%,transparent);
  position:sticky;top:0;z-index:10;
}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--g);letter-spacing:-0.5px}
.logo span{color:var(--w);font-size:11px;font-family:'Inter',sans-serif;font-weight:300;letter-spacing:2px;display:block;margin-top:-2px}
.cta-top{background:var(--g);color:#000;border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block}

/* HERO — compact */
.hero{
  padding:8px 20px 24px;
  background:radial-gradient(ellipse 100% 200px at 50% 0%,rgba(201,169,110,0.08),transparent);
  text-align:center;
}
.hero h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;line-height:1.1;letter-spacing:-1px;margin-bottom:8px}
.hero h1 em{font-style:normal;color:var(--g)}
.hero p{font-size:13px;color:var(--gr);margin-bottom:20px;line-height:1.5}
.hero-btns{display:flex;gap:10px;justify-content:center}
.btn-p{background:var(--g);color:#000;border:none;border-radius:6px;padding:12px 24px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block}
.btn-s{background:transparent;color:var(--w);border:1px solid var(--br);border-radius:6px;padding:12px 20px;font-size:13px;font-weight:400;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--br);border-bottom:1px solid var(--br);margin:0 0 24px}
.stat{padding:14px 8px;text-align:center;border-right:1px solid var(--br)}
.stat:last-child{border-right:none}
.snum{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--g);display:block;line-height:1}
.slbl{font-size:9px;color:var(--gr);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px;display:block}

/* SECTION */
.sec{padding:0 16px 24px}
.sec-label{font-size:9px;text-transform:uppercase;letter-spacing:3px;color:var(--g);font-weight:600;margin-bottom:12px;display:block}
.sec-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;margin-bottom:16px;line-height:1.2}

/* CATEGORY TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--br);color:var(--gr);background:transparent;font-family:'Inter',sans-serif;transition:.15s}
.tab.active{background:var(--g);color:#000;border-color:var(--g);font-weight:600}

/* SERVICE CARDS */
.cards{display:flex;flex-direction:column;gap:8px}
.card{
  background:var(--card);border:1px solid var(--br);border-radius:10px;
  padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px;
  transition:.15s;active:background:rgba(201,169,110,0.08);
}
.card.hot{border-color:rgba(201,169,110,0.3)}
.card-icon{font-size:28px;flex-shrink:0;width:44px;height:44px;background:rgba(201,169,110,0.08);border-radius:10px;display:flex;align-items:center;justify-content:center}
.card-body{flex:1}
.card-name{font-size:15px;font-weight:500;margin-bottom:3px}
.card-desc{font-size:12px;color:var(--gr);line-height:1.4}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.card-days{font-size:10px;color:var(--g);font-weight:500}
.card-badge{font-size:9px;background:var(--g);color:#000;padding:2px 7px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.card-price{text-align:right;flex-shrink:0}
.price-from{font-size:9px;color:var(--gr)}
.price-val{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:var(--g);white-space:nowrap}
.card-arrow{font-size:16px;color:var(--gr);margin-left:4px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.25s}
.overlay.open{opacity:1;pointer-events:all}
.modal{
  background:#111114;border-top:1px solid var(--br);
  border-radius:20px 20px 0 0;padding:24px 20px 40px;
  width:100%;transform:translateY(100%);transition:.25s;
  max-height:85vh;overflow-y:auto;
}
.overlay.open .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--br);border-radius:2px;margin:0 auto 20px}
.modal-icon{font-size:40px;margin-bottom:12px;display:block}
.modal-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:6px}
.modal-price{font-size:28px;font-weight:700;color:var(--g);margin-bottom:16px;font-family:'Playfair Display',serif}
.modal-desc{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:20px}

/* FEATURES LIST */
.features{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.feature{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.4}
.feature::before{content:'✓';color:var(--g);font-weight:700;flex-shrink:0;margin-top:1px}

.modal-close{position:absolute;top:16px;right:20px;font-size:22px;color:var(--gr);cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.modal-btn{width:100%;padding:15px;background:var(--g);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}

/* BOTTOM FIXED */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,8,11,0.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--br);padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;z-index:9;
}
.bottom-price{font-size:11px;color:var(--gr)}
.bottom-price strong{color:var(--w);font-size:14px;display:block}
.bottom-btn{background:var(--g);color:#000;border:none;border-radius:8px;padding:11px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block}

@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cards .card{animation:slideUp .3s ease both}
.cards .card:nth-child(2){animation-delay:.05s}
.cards .card:nth-child(3){animation-delay:.1s}
.cards .card:nth-child(4){animation-delay:.15s}
.cards .card:nth-child(5){animation-delay:.2s}
</style>
</head>
<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo">OBSIDIAN<span>AI АГЕНТСТВО</span></div>
  <a href="https://t.me/Bloge11r_bot" class="cta-top">Заказать</a>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Автоматизируем<br><em>ваш бизнес</em></h1>
  <p>Telegram боты, WhatsApp, AI агенты — за 2-7 дней</p>
  <div class="hero-btns">
    <a href="#services" class="btn-p" onclick="scrollToServices()">Смотреть услуги</a>
    <a href="https://t.me/Bloge11r_bot" class="btn-s">Написать</a>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><span class="snum">50+</span><span class="slbl">Проектов</span></div>
  <div class="stat"><span class="snum">2-7</span><span class="slbl">Дней срок</span></div>
  <div class="stat"><span class="snum">50%</span><span class="slbl">Предоплата</span></div>
</div>

<!-- SERVICES -->
<div class="sec" id="services">
  <span class="sec-label">Услуги</span>
  <div class="tabs">
    <button class="tab active" onclick="filterCat('all',this)">Все</button>
    <button class="tab" onclick="filterCat('tg',this)">📱 Telegram</button>
    <button class="tab" onclick="filterCat('wa',this)">💬 WhatsApp</button>
    <button class="tab" onclick="filterCat('web',this)">🌐 Сайты</button>
    <button class="tab" onclick="filterCat('ai',this)">🤖 AI</button>
  </div>
  <div class="cards" id="cards"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="bottom-price">
    <strong>от 20 000₽</strong>
    Предоплата 50%
  </div>
  <a href="https://t.me/Bloge11r_bot" class="bottom-btn">Написать Дамиру →</a>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="position:relative">
    <div class="modal-handle"></div>
    <span class="modal-close" onclick="closeModal()">✕</span>
    <span class="modal-icon" id="m-icon"></span>
    <div class="modal-name" id="m-name"></div>
    <div class="modal-price" id="m-price"></div>
    <div class="modal-desc" id="m-desc"></div>
    <div class="features" id="m-features"></div>
    <button class="modal-btn" onclick="order()">Заказать сейчас →</button>
  </div>
</div>

<script>
var SERVICES = [
  {id:'vizitka',cat:'tg',icon:'🪪',name:'Бот-визитка',price:'от 8 000₽',days:'2 дня',
   desc:'Красивый бот с меню, разделами и контактами. Первый шаг в автоматизации для любого бизнеса.',
   features:['Главное меню с разделами','О компании, услуги, контакты','Кнопки для связи с менеджером','Деплой на Render бесплатно','Исходный код на GitHub']},

  {id:'booking',cat:'tg',icon:'📅',name:'Бот записи',price:'от 15 000₽',days:'3 дня',badge:'Хит',
   desc:'Клиент выбирает удобное время, получает подтверждение и напоминание. Работает 24/7 без вашего участия.',
   features:['Выбор даты и времени','Подтверждение записи','Напоминание за 2 часа','Отмена/перенос записи','Уведомление администратору']},

  {id:'faq',cat:'tg',icon:'❓',name:'FAQ бот',price:'от 10 000₽',days:'2 дня',
   desc:'Отвечает на частые вопросы автоматически. Клиент получает ответ мгновенно, вы не тратите время.',
   features:['Категории вопросов','Поиск по ключевым словам','Неограниченное кол-во ответов','Кнопка связи с менеджером','Статистика популярных вопросов']},

  {id:'payment',cat:'tg',icon:'💳',name:'Бот с оплатой',price:'от 20 000₽',days:'4 дня',
   desc:'Принимает оплату прямо в Telegram. Клиент платит — сразу получает доступ или товар.',
   features:['Telegram Stars / ЮКасса / СБП','Автоматическая выдача доступа','Уведомление об оплате','История транзакций','Возвраты и отмены']},

  {id:'ai-bot',cat:'ai',icon:'🤖',name:'AI бот с памятью',price:'от 35 000₽',days:'7 дней',badge:'Топ',
   desc:'Умный бот на Claude или GPT — помнит каждого клиента, понимает контекст, отвечает как живой менеджер.',
   features:['Память каждого клиента','Понимает сложные вопросы','Работает как менеджер 24/7','Интеграция с базой данных','Обучение на ваших данных']},

  {id:'wa-base',cat:'wa',icon:'📲',name:'WhatsApp бот базовый',price:'от 15 000₽',days:'3 дня',
   desc:'Автоответы, меню услуг и приём заявок в WhatsApp. Клиенты получают ответ мгновенно.',
   features:['Автоответы на сообщения','Меню услуг','Приём заявок','Уведомление менеджеру','WhatsApp Business API']},

  {id:'wa-crm',cat:'wa',icon:'⚡',name:'WhatsApp + CRM',price:'от 30 000₽',days:'5 дней',
   desc:'Бот + база клиентов в облаке + уведомления менеджеру. Полноценная система управления клиентами.',
   features:['Всё из базового бота','База клиентов Supabase','История переписки','Теги и статусы клиентов','Аналитика обращений']},

  {id:'landing',cat:'web',icon:'🖥️',name:'Лендинг',price:'от 12 000₽',days:'3 дня',
   desc:'Современный сайт-визитка на GitHub Pages. Бесплатный хостинг навсегда, SEO, мобильная адаптация.',
   features:['Современный дизайн','Мобильная адаптация','SEO оптимизация','Бесплатный хостинг','Подключение своего домена']},

  {id:'n8n',cat:'web',icon:'⚙️',name:'n8n Автоматизация',price:'от 20 000₽',days:'4 дня',
   desc:'Автоматические отчёты, сбор лидов, рассылки по базе, интеграция с CRM — всё без кода.',
   features:['Автоматические отчёты','Сбор лидов с форм','Рассылки по базе','Интеграция с CRM','Уведомления в Telegram']},

  {id:'full',cat:'ai',icon:'🏢',name:'Полная автоматизация',price:'от 60 000₽',days:'14 дней',badge:'Всё включено',
   desc:'Бот + сайт + CRM + автоотчёты + техподдержка 1 месяц. Берём бизнес на автопилот полностью.',
   features:['Telegram бот под ключ','Лендинг с SEO','CRM система','Автоотчёты в Telegram','Техподдержка 1 месяц']},
];

var currentCat = 'all';

function renderCards(cat) {
  var list = cat === 'all' ? SERVICES : SERVICES.filter(function(s){return s.cat===cat});
  var html = '';
  list.forEach(function(s) {
    html += '<div class="card'+(s.badge?' hot':'')+'" onclick="openModal(\''+s.id+'\')">'+
      '<div class="card-icon">'+s.icon+'</div>'+
      '<div class="card-body">'+
        '<div class="card-name">'+s.name+'</div>'+
        '<div class="card-desc">'+s.desc.slice(0,60)+'...</div>'+
        '<div class="card-meta">'+
          '<span class="card-days">⚡ '+s.days+'</span>'+
          (s.badge?'<span class="card-badge">'+s.badge+'</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="card-price">'+
        '<div class="price-from">от</div>'+
        '<div class="price-val">'+s.price.replace('от ','')+'</div>'+
      '</div>'+
    '</div>';
  });
  document.getElementById('cards').innerHTML = html;
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  renderCards(cat);
}

function openModal(id) {
  var s = SERVICES.find(function(x){return x.id===id});
  if(!s) return;
  document.getElementById('m-icon').textContent = s.icon;
  document.getElementById('m-name').textContent = s.name;
  document.getElementById('m-price').textContent = s.price;
  document.getElementById('m-desc').textContent = s.desc;
  var feats = s.features.map(function(f){return '<div class="feature">'+f+'</div>'}).join('');
  document.getElementById('m-features').innerHTML = feats;
  document.getElementById('overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

function order() {
  window.open('https://t.me/Bloge11r_bot', '_blank');
  closeModal();
}

function scrollToServices() {
  document.getElementById('services').scrollIntoView({behavior:'smooth'});
}

// Init
renderCards('all');

// Telegram WebApp
if(window.Telegram && window.Telegram.WebApp) {
  var tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.BackButton.onClick(function(){ closeModal(); });
}
</script>
</body>
</html>
